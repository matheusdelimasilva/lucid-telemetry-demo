# GitHub Actions port of .gitlab-ci.yml (kept for reference). Same jobs, same
# commands, same artifact hand-offs. Differences: Redpanda comes from the repo's
# docker-compose.yml (`make up`) instead of a CI service, and Docker jobs run on
# the runner's Docker instead of dind. GitLab stage ordering (build -> test) is
# preserved with `needs`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KAFKA_BROKER: localhost:9092

jobs:
  # ---- guard ---------------------------------------------------------------
  # Runs the TARGET branch's copy of ci/oracle_guard.sh against the PR diff, so
  # a PR can't edit the guard to let itself through. If the target has no
  # script yet, the job passes only for the PR that adds it (bootstrap; that
  # one PR is unguarded) and fails otherwise.
  oracle-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run the target branch's ci/oracle_guard.sh
        env:
          TARGET: ${{ github.base_ref }}
        run: |
          git fetch origin "$TARGET"
          if git cat-file -e "origin/$TARGET:ci/oracle_guard.sh" 2>/dev/null; then
            git show "origin/$TARGET:ci/oracle_guard.sh" > "$RUNNER_TEMP/oracle_guard.sh"
            echo "running origin/$TARGET:ci/oracle_guard.sh ($(git rev-parse --short "origin/$TARGET"))"
            sh "$RUNNER_TEMP/oracle_guard.sh" "origin/$TARGET" HEAD
          else
            base=$(git merge-base "origin/$TARGET" HEAD)
            if ! git cat-file -e "$base:ci/oracle_guard.sh" 2>/dev/null \
                && git cat-file -e "HEAD:ci/oracle_guard.sh" 2>/dev/null; then
              echo "::warning::origin/$TARGET has no ci/oracle_guard.sh and this PR adds it: bootstrap, this PR is not guarded"
            else
              echo "::error::origin/$TARGET has no ci/oracle_guard.sh and this PR does not add it"
              exit 1
            fi
          fi

  # ---- build stage ---------------------------------------------------------
  spark-hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make spark-image
      - run: docker run --rm lucid-spark-hello:dev > spark-hello.log 2>&1 || (cat spark-hello.log && exit 1)
      - run: cat spark-hello.log
      - run: grep "DECODED vin=TST00000000000003" spark-hello.log

  examples-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r generator/requirements.txt
      - run: python -m grpc_tools.protoc -I proto --python_out=generator proto/*.proto
      - run: python parity/replay/check_examples.py

  proto-optional-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.5/protoc-25.5-linux-x86_64.zip -o /tmp/protoc.zip
      - run: sudo unzip -o /tmp/protoc.zip -d /usr/local && protoc --version
      - run: sh docker/check-proto-optional.sh

  # ---- test stage ----------------------------------------------------------
  rust-smoke:
    needs: [spark-hello, examples-check, proto-optional-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev
      - run: cd stream-rs && rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stream-rs
          shared-key: rust-smoke
      - run: make up
      - run: cd stream-rs && cargo build --release -p smoke && cargo run --release -p smoke
      - if: always()
        run: make down

  python-smoke:
    needs: [spark-hello, examples-check, proto-optional-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r generator/requirements.txt
      - run: python -m grpc_tools.protoc -I proto --python_out=generator proto/*.proto
      - run: make up
      - run: python generator/smoke_send.py
      - if: always()
        run: make down

  spark-examples:
    needs: [spark-hello, examples-check, proto-optional-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make spark-examples
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-examples
          path: build/spark-examples
          if-no-files-found: error

  rust-replay:
    needs: [spark-examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spark-examples
          path: build/spark-examples
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev
      - run: cd stream-rs && rustup toolchain install && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stream-rs
          shared-key: rust-replay
      - run: make up
      - run: cd stream-rs && cargo fmt --check
      - run: cd stream-rs && cargo clippy -p common --all-targets -- -D warnings
      - run: cd stream-rs && cargo test -p common
      - run: cd stream-rs && SPARK_EXAMPLES_DIR=$GITHUB_WORKSPACE/build/spark-examples cargo test -p common -- --ignored --nocapture
      - if: always()
        run: make down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-examples
          path: build/rust-examples
          if-no-files-found: warn

  baseline-repro:
    needs: [spark-hello, examples-check, proto-optional-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make baseline-repro
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-baseline
          path: build/spark-baseline
          if-no-files-found: error

  # ---- verify stage --------------------------------------------------------
  # Auto-discovers stream-rs/jobs/*/Cargo.toml (ci/rust_parity.sh); stages 5-6
  # add a job directory and never edit CI. With no jobs it passes and says so.
  # Per job: fixture + suite replay, suite-check/parity/privacy-check, the
  # crate's tests (plain and --ignored, hence Redpanda via `make up`), and
  # `docker build -f deploy/<job>.Dockerfile .` when that file exists.
  rust-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev
      - run: cd stream-rs && rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stream-rs
          shared-key: rust-parity
      - run: make up
      - run: sh ci/rust_parity.sh
      - if: always()
        run: make down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-parity
          path: build/rust-parity
          if-no-files-found: ignore

  parity:
    needs: [baseline-repro]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spark-baseline
          path: build/spark-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: |
          status=0
          make parity JOB=charging-sessions RUN=build/spark-baseline || status=1
          make parity JOB=battery-health RUN=build/spark-baseline || status=1
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-reports
          path: build/spark-baseline/*.parity.md
          if-no-files-found: warn

  privacy-check:
    needs: [baseline-repro]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spark-baseline
          path: build/spark-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: |
          status=0
          make privacy-check JOB=charging-sessions RUN=build/spark-baseline || status=1
          make privacy-check JOB=battery-health RUN=build/spark-baseline || status=1
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-reports
          path: build/spark-baseline/*.privacy.md
          if-no-files-found: warn
